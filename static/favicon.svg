<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#06080f" stroke="url(#grad)" stroke-width="2"/>
  <!-- Vertical bars (shield-like symbol) -->
  <rect x="35" y="25" width="8" height="50" fill="url(#grad)"/>
  <rect x="57" y="25" width="8" height="50" fill="url(#grad)"/>
  <!-- Horizontal bar (representing unity/rank) -->
  <rect x="30" y="48" width="40" height="4" fill="url(#grad)"/>
</svg>
